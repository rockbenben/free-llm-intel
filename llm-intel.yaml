  # 小米 MiMo
  # 首页为 SSG 预渲染（静态即可拿到完整正文）；文档站为前端渲染 SPA
  # （任意路由静态都返回 ~13KB 空壳），需浏览器兜底。定价页含「TTS 系列限时免费」原文。
  - vendor_id: xiaomi_mimo
    type: pricing
    url: https://mimo.mi.com/
  - vendor_id: xiaomi_mimo
    type: pricing
    url: https://mimo.mi.com/docs/zh-CN/price/pay-as-you-go
  - vendor_id: xiaomi_mimo
    type: token_plan
    url: https://mimo.mi.com/docs/zh-CN/price/token-plan
  - vendor_id: xiaomi_mimo
    type: referral
    url: https://mimo.mi.com/docs/zh-CN/quick-start/promotions/refer
  # 博客 / 更新动态（News 端）。小米是**自有模型厂商**（MiMo 系列），按「聚合第三方
  # 模型的平台不汇聚、自有模型厂商保留」的判据应当收录。三个页面均为前端渲染 SPA
  # （静态抓取常只拿到 ~13KB 空壳，需浏览器兜底）；更新日志正文是「日期分节标题 + 条目」。
  # 实测：模型发布 / 功能更新能解析出带日期的条目；新闻页标题最干净但列表不带日期
  # （无日期条目只进单厂商源、不进合并流，见 write_rss_feeds 的日期规则）。
  - vendor_id: xiaomi_mimo
    type: updates
    url: https://mimo.mi.com/docs/zh-CN/updates/model
  - vendor_id: xiaomi_mimo
    type: updates
    url: https://mimo.mi.com/docs/zh-CN/updates/feature/platform
  # 官方新闻页 `docs/zh-CN/news`（2026-09-25 重新收录）：此前列表项不满足文章路径
  # 启发式、实测提取 0 条而移除；现列表项改链 `/news/latest/<slug>`，浏览器渲染后
  # 可提取 15 条详情页（标题比更新日志的「日期 + 发布」锚点干净，与同日锚点重复时
  # 保留新闻详情页、丢弃锚点，见 collect_news_articles 的同日去重规则）。
  - vendor_id: xiaomi_mimo
    type: updates
    url: https://mimo.mi.com/docs/zh-CN/news


    url: https://openai.com/news/rss.xml

  # Anthropic Claude
  - vendor_id: anthropic
    type: api_docs
    # 原 https://docs.anthropic.com/ —— 官方已迁到 platform.claude.com，这里直接用规范地址
    # （原地址会 301 过去，仍可用，但攻略里显示的地址不该是旧的）
    url: https://platform.claude.com/docs/en/home
  - vendor_id: anthropic
    type: pricing
    url: https://claude.com/pricing
  - vendor_id: anthropic
    type: blog
    lang: en
    url: https://claude.com/resources/articles
  - vendor_id: anthropic
    type: news
    lang: en
    url: https://www.anthropic.com/news
  # 原有一个 https://www.anthropic.com/engineering 源已移除：该页**不含日期**
  # （实测整页 0 个日期串，抓到的 26 条全部无日期），于是它产出的条目永远进不了合并流，
  # 只把归档撑到 67 条、其中 31 条无日期。要看工程文章可从 /news 里点进去。

  # Google Gemini
  #
  # ⚠️ 2026-11-04：Google 把 Gemini API 文档整体迁到 aistudio.google.com，HTML 页改为
  # JS 渲染（requests 只拿到 40–60 字的空壳，`snapshot_ok=False` → **变化检测彻底失效**，
  # 额度改版不会被巡检发现）。官方同时在这些页面提供了纯文本 `.md` 版本
  # （`> ## AI Agent Context` 开头），静态可读、内容与 HTML 同源，故情报源一律走 `.md`。
  # 旧的 ai.google.dev/gemini-api/docs/* 现在 302 到这里；`.md` 后缀在旧域名上返回的是
  # HTML 壳（不是 markdown），迁移时别用旧域名 + `.md`。
  - vendor_id: google_gemini
    type: api_docs
    url: https://aistudio.google.com/docs
  - vendor_id: google_gemini
    type: pricing
    url: https://aistudio.google.com/docs/pricing.md
  - vendor_id: google_gemini
    type: billing
    url: https://aistudio.google.com/docs/billing.md
  - vendor_id: google_gemini
    type: rate_limits
    url: https://aistudio.google.com/docs/rate-limits.md
  - vendor_id: google_gemini
    # **官方 API 变更日志** —— 本仓库关心的是模型上下线 / 定价 / 限额，这才是对的源
    # （113 条全部带日期，条目如「Gemini 3.8 Flash generally available (GA)」）。
    # 此前抓 cloud.google.com/blog/products/ai-machine-learning/ —— 那是整个 Google Cloud
    # 的 AI 博客，混进非 Gemini 内容、且页面拿不到日期（11 条全无日期、进不了合并流）。
    # 中间一度换成 blog.google/products/gemini/rss/（有日期但是**消费级** Gemini 博客），
    # 与「API 免费额度」无关，已弃用。
    # 该页的标题 id 是 MM-DD-YYYY（`id="09-17-2026"`），曾因日期解析只认 YYYY-MM-DD
    # 而整页 0 条 —— 已修（见 extract_changelog_sections 的日期 id 解析）。
    # 变更日志**不要**换成 `.md`：markdown 版只有「日期 → 无序列表」，抽取器给不出条目
    # （实测 0 条）；HTML 版虽要浏览器兜底，但一条日期段能拆出多条（实测 100 条，带日期），
    # CI 装了 Chromium，本地跑也默认启用浏览器。
    #
    # lang 声明 zh 与页面语种无关：这个字段管「Accept-Language」与「进不进英文镜像」。
    # 归档里 151 条标题早已汉化冻住，改成 en 会把中文标题灌进英文合并流
    # （`_english_eligible` 只看源声明）；页面本身是英文，但我们的产物是中文口径。
    type: changelog
    lang: zh
    url: https://aistudio.google.com/docs/changelog

  # xAI Grok
  - vendor_id: xai_grok
    type: api_docs
    url: https://docs.x.ai/overview
  - vendor_id: xai_grok
    type: pricing
    url: https://docs.x.ai/developers/pricing
  - vendor_id: xai_grok
    type: free_quota
    url: https://docs.x.ai/developers/quickstart
  - vendor_id: xai_grok
    type: console
    url: https://console.x.ai/home
  - vendor_id: xai_grok
    type: news
    lang: en
    url: https://x.ai/news

  # Groq Cloud
  # ⚠️ 2026-11-04 复核：groq.com/pricing 已 302 到官方首页（定价页下线），
  # 该入口抓到的只是首页营销文案，会把「首页改版」误报成「定价变化」，故不再保留
  # pricing 源。免费层限额见下方 rate_limits（Free Plan Limits 分页），
  # 付费档位与单价只在控制台内可见。
  - vendor_id: groq
    type: rate_limits
    url: https://console.groq.com/docs/rate-limits
  - vendor_id: groq
    type: models_docs
    url: https://console.groq.com/docs/models
  - vendor_id: groq
    # ⚠️ 2026-09-22 起**不再配博客源**（原 https://groq.com/blog/）：该源一半是营销科普
    # （「什么是语言处理单元？」），一半是 GitHub commit 标题（`add updates (#17)`、
    # `yay first ever groq changelog entry (#1)`），情报价值低。
    # **Groq 的免费额度情报不受影响**（仍在 README 攻略与厂商总表里），这里只是不再汇聚博客动态。
    # 2026-09-26 从 HTML 页切到 Mintlify `.md` 端点：HTML 版的日期只存在于 JS 渲染后
    # （条目全部无日期、进不了合并流），`.md` 是服务端渲染的纯 Markdown——
    # 日期行 + `### 分类[标题](#锚点)`（见 extract_md_changelog），实测 34 条全带日期。
    # 最新分节省略年份（`Apr 18`）按「新→旧排列 + 不晚于今天」回推，与页面元数据独立印证一致。
    type: changelog
    lang: en
    url: https://console.groq.com/docs/changelog.md


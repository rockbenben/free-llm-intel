  # AI21 动态（2026-09-30 换源）：原 `blog` 指向列表页，抓回来的是 13 条
  # `https://www.ai21.com/blog/#d-<日期>-<n>` **合成锚点**——点进去就是列表页本身，
  # 与 deepseek / x.ai / claude 那个缺陷同源（见 NEWS_CANONICAL_ONLY_VENDORS 注释）。
  # 站的正文其实在 WordPress 上，wp-json 给的是规范直链 + 精确发布时间。
  # 没有 RSS 可走：/feed、/blog/feed、/feed/ 全是 catch-all 返回同一份首页 HTML，
  # /rss.xml 404，robots.txt 只承认 sitemap_index.xml。
  # `_fields` 瘦身：不裁字段时每条都带整篇正文 HTML，响应会大两个数量级。
  # 只取最近 100 条（WP 的 per_page 上限），条目老化由爬虫的两年窗口负责（见
  # JSON_NEWS_WINDOW_DAYS）—— **不要**在这里写死 `after=<日期>`：固定日期会随时间
  # 越放越宽，2023 年的旧帖会一路渗进浏览页。
  - vendor_id: ai21_labs
    type: blog
    lang: en
    url: "https://www.ai21.com/wp-json/wp/v2/posts?per_page=100&orderby=date&order=desc&_fields=date,link,title"
    page: https://www.ai21.com/blog

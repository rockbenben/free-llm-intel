name: refresh-intel

# 每天 UTC 03:19（北京时间 11:19）自动巡检官方页面；也可在 Actions 页面手动触发。
#
# ⚠ 改 cron 前必读：时段有**硬约束**，不是随便挑的。
#   调度必须落在「北京日期 == UTC 日期」的时段，即**北京 08:00–24:00**（UTC 00:00–16:00）。
#   落在北京 00:00–08:00 会让 runner 的 UTC 日期比北京早一天，而 crawler 的
#   `_drop_future_date()` 正是拿 runner 本地日期当"今天"——国内厂商当天发的文章
#   （日期=北京今天）会被判为未来日期而丢日期、进不了合并流（次日抓取才自愈）。
#   现有 11:19 同时满足另外三点：① 已过美国工作日结束点（太平洋 17:00 = 北京 08:00
#   夏令时 / 09:00 冬令时），前一天美国厂商的发布全部收齐；② 非整点分钟，避开
#   Actions 的整点排队高峰；③ Gemini 免费层 RPD 在太平洋午夜重置（夏令时北京
#   15:00 / 冬令时 16:00），此刻新桶已重置大半天、没被例行运行用过，距下次重置还有数小时可重试。
#   若更看重国内厂商当日覆盖，可改北京 19:19（国内工作日 09:00–19:00 全收齐），
#   代价是海外厂商的滞后从 3–11 小时拉到 11–19 小时。
#
# 流程：脚本抓取全部官方页并与 llm-intel-state.json 中的文本快照比对——
#   1. 页面无变化：不重写产物、不产生提交；
#   2. 仅新闻 / 博客变化：直接原子性提交到 main；
#   3. 免费额度等事实字段可能变化（快照 hash 改变）：调用 Google AI Studio 的
#      Gemini API（默认模型见 ai_review.GEMINI_DEFAULT_MODEL，免费层 Key）阅读变化页面，
#      证据逐字命中页面原文才允许更新 profile_overrides.json。
#
# 第 3 类变化的提交策略：**自动采纳，不开 PR 等人工审核**
#   （2026-09-22 改：原先开 PR 等审核，但每日巡检都开 PR、没人天天去合，PR 会一直积压；
#    而档案更新本身已有「证据逐字命中页面原文」这道硬校验，不需要再人工过一遍。）
#   - 档案更新（profile_overrides.json + 重渲染的 README）与快照 / 新闻
#     **一起原子提交**并直推 main —— 避免"先开 PR 再推快照"两段式在中间失败；
#   - 改动全部带 `_evidence`（页面原文逐字摘录）与 `_summary`，可事后追溯；
#     若发现更新有误，直接 revert 那次巡检提交即可。
#   （曾有过的「同步遗留 ai/intel-update 分支」步骤已随最后一条遗留分支的清理退役，
#    测试里有守卫防止复活——旧分支会把过期补丁灌回 main。）
#
# 提交流程的 git 顺序固定为 add -> commit -> pull --rebase -> push，不可调换：
# crawler 跑完后工作区必然是脏的（快照 / 新闻 / README 都已重写），此时先执行
# pull --rebase 会被 git 直接拒绝——"cannot pull with rebase: You have unstaged
# changes"，以 exit 128 中断，push 根本没机会运行。
#
# 自建 RSS：脚本把 llm-news/ 归档同时写成 docs/feeds/ 下的产物——RSS 2.0 XML
# （含全厂商合并流与每厂商单源）、多个 JSON 索引（核心为 vendors / articles /
# model-releases 模型发布雷达，另有变更日志与额度索引），与新闻产物在同一次提交里落盘。
# docs/ 就是 GitHub Pages 的
# 发布目录，订阅地址形如 https://<owner>.github.io/<repo>/feeds/llm-news-all.xml；
# 该地址由脚本按 Actions 注入的 GITHUB_REPOSITORY 自动推导，fork 后无需改代码。
# docs/.nojekyll 关闭 Jekyll 处理，保证 XML 原样输出。官方没有 RSS/Atom 的厂商
# （见 llm-news-feeds.md 里的「未发现 RSS/Atom 链接」）正是靠这个源自建订阅。
#
# 所需配置：
#   - Settings -> Secrets and variables -> Actions 添加 GEMINI_API_KEY
#     （免费申请：https://aistudio.google.com/apikey；无该 secret 时第 3 类变化
#       会保留旧哈希、次日自动重试，新闻更新不受影响）；
#   - Settings -> Actions -> General -> Workflow permissions：
#     1) 选择 "Read and write permissions"；
#     （**不再需要**勾选 "Allow GitHub Actions to create and approve pull requests" ——
#      2026-09-22 起巡检不再开 PR，档案更新与快照 / 新闻一起直接提交到 main）
#   - Settings -> Pages -> Source 选 "Deploy from a branch"，Branch=main、目录=/docs
#     （自建 RSS 的托管；不配置则订阅地址 404，其余产物不受影响）；
#   - 若 main 分支开启了 Branch Protection（分支保护），请在规则中允许 github-actions[bot] bypass；
#   - schedule 仅在默认分支存在该 workflow 时才会被 GitHub 调度。
#
# 依赖版本：所有 action 都选运行在 Node.js 24 上的大版本，以避开 Node 20 弃用告警。
# 由此产生的 runner 最低版本要求，GitHub 托管 runner 天然满足；
# 自建 runner 换大版本前先核对该 action 的 runner 版本要求，必要时先升级。
"on":
  schedule:
    - cron: "19 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-intel
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 首次运行是冷启动：翻译缓存未命中需冷译归档全量标题 + 全量深度抓取 + 浏览器内核安装，
    # 比缓存命中的常规巡检慢一个量级；timeout 按冷启动上限留余量，别按常规耗时判断。
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Chromium 仅对 requests 抓到 JS 空壳 / 403 的部分入口页面兜底，
      # 用于保证 README「实时巡检证据」列的质量与本地带浏览器巡检一致。
      # 注意：快照哈希刻意只取 requests 阶段文本（浏览器渲染不写 snapshot_text），
      # 因此浏览器开关不影响变化检测，不会引发 AI 核查误触发。
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      # 复用标题翻译缓存，避免每天把归档里的全部标题重新机翻一遍。
      - name: Restore translate cache
        uses: actions/cache@v6
        with:
          path: .translate_cache.json
          key: translate-cache-${{ github.run_id }}
          restore-keys: translate-cache-

      # 英文原文回填台账：与翻译缓存同类（不进 git，靠 Actions cache 续命）。
      # 记过「这一页给不出英文原文」的 URL 不再重打——没有这层记忆，回填每轮都会
      # 把同一批失败项重试一遍，单次上限的配额被吃光，字母序排在后面的厂商永远轮不到
      # （见 crawler.backfill_archive_originals 的注释）。缓存被逐出即重新开始。
      - name: Restore backfill ledger
        uses: actions/cache@v6
        with:
          path: .backfill_orig_ledger.json
          key: backfill-ledger-${{ github.run_id }}
          restore-keys: backfill-ledger-

      # 逐篇访问「标题已汉化但归档里没存英文原文」的文章页，把原文补进 `<!--orig:-->`。
      # 这些原文是产出层 original_title 的对照素材，也是让 AI 重译标题的前提
      # （CONTRIBUTING「标题汉化与 AI 优化」）。
      # 必须排在 crawler **之前**：爬虫是把归档当作合并基底读的，注释在这一轮就写进去，
      # 当天的 RSS / articles.json 才能带上原文；排在后面则产物晚一天。
      # continue-on-error：回填是增强项，它挂了不该挡掉当天的巡检产物提交。
      - name: Backfill article originals
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python crawler_llm_intel.py --backfill-orig

      # 灾难性失败护栏：情报页失败占比 ≥ INTEL_FAIL_ABORT_RATIO（多数失败）时，
      # crawler 以非零码退出，本步骤随即失败，后面的 Verify / Commit 都不执行 ——
      # 宁可不提交当天产物，也不拿大面积「解析失败」的 README 覆盖上一轮健康产物。
      # 健康巡检失败率近零，偶发单源反爬够不着这条线（阈值与理由见 crawler 常量注释）。
      - name: Run intel crawler
        env:
          PYTHONIOENCODING: utf-8
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 可用 repository variable 覆盖模型；未设置时走代码默认（见 ai_review）
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          # 订阅源的对外前缀。留空则优先读 docs/CNAME（自定义域名），其次按
          # GITHUB_REPOSITORY 推导为 https://<owner>.github.io/<repo>/feeds
          # （fork 后无需配置）；显式传入可覆盖推导值。
          FEEDS_BASE: ${{ vars.FEEDS_BASE }}
        run: python crawler_llm_intel.py --ai-review --ai-titles --feeds-base "$FEEDS_BASE"

      # 产物与不变量校验：跑**全部**用例。
      # 测试集由 test_workflow_and_review.ci_suite() 按「全部 − 白名单」推导：
      # 以后新增用例自动进 CI，不需要谁记得回来改这里（手写类清单必然漂移）。
      # 排除集以 CI_EXCLUDED_CLASSES 为准 —— 曾经排除 TestCrawlerCleanup（它会删掉仓库根的 .ai-changed，
      # 而那是下一步 Decide commit path 的判据），后来把仓库根改成可注入的
      # `crawler_llm_intel._repo_root()`，该测试改在临时目录里跑，就不再需要排除。
      # 放在抓取之后：校验的是本次即将提交的新产物，失败即拦住提交。
      - name: Verify generated artifacts and invariants
        run: python -c "import sys, unittest, test_workflow_and_review as t; sys.exit(0 if unittest.TextTestRunner(verbosity=2).run(t.ci_suite()).wasSuccessful() else 1)"

      - name: Decide commit path
        id: route
        run: |
          if [ -f .ai-changed ]; then
            echo "kind=pr" >> "$GITHUB_OUTPUT"
            echo "检测到档案更新：将以 chore(ai) 提交，与快照 / 新闻一次原子推送到 main。"
            cat .ai-changed
          else
            echo "kind=direct" >> "$GITHUB_OUTPUT"
          fi

      # 2026-09-22：原先这里用 create-pull-request 开 PR 等人工审核，
      # 现改为与快照 / 新闻一起原子提交（见下方 "Commit all updates" 步骤）。

      # 2026-09-22：原先这里是"PR 创建成功后再直推快照"的第二段，
      # 现已合并进下方 "Commit all updates"，不再分两段（分两段时中间失败会丢变更）。

      # 快照、新闻、README、档案覆盖层、情报变更日志**单次原子提交**并推送到 main。
      # 2026-09-22 起不再区分「有 AI 档案更新」与「无」—— 原先前者要开 PR 等审核，
      # 现在统一走这一条路径（档案更新带 `_evidence` 页面原文摘录，可事后追溯）。
      - name: Commit all updates
        run: |
          git add llm-intel-state.json llm-news-feeds.md llm-news-feeds.opml llm-news docs/feeds README.md profile_overrides.json
          # 变更日志要到第一次 AI 采纳档案更新才落盘；对不存在的路径 git add 会
          # 以 exit 128 中断整个提交步骤（2026-09-25 巡检就是这么挂的），故先判存在。
          if [ -f llm-intel-changelog.md ]; then git add llm-intel-changelog.md; fi
          if git diff --cached --quiet; then
            echo "本次无任何内容变更。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.route.outputs.kind }}" = "pr" ]; then
            git commit -m "chore(ai): 依据官方页面变化更新免费额度档案并刷新巡检产物"
          else
            git commit -m "chore: 定时巡检刷新官方情报与博客动态"
          fi
          # 必须先 commit 再 rebase，原因见文件头「提交流程的 git 顺序」说明。
          if ! git pull --rebase origin main; then
            echo "::error::rebase 到最新 main 失败：远端在巡检期间有新提交，且与本次产物冲突。请手动 rebase 后重跑。"
            exit 1
          fi
          # push 失败时 GitHub 只回一个 exit 128，看不出原因，这里显式翻译成排查指引。
          if ! git push origin HEAD:main; then
            echo "::error::推送被拒绝。请检查：① Settings -> Actions -> General -> Workflow permissions 是否已选 Read and write permissions；② 若 main 开启了 Branch Protection，规则中是否允许 github-actions[bot] bypass。"
            exit 1
          fi
